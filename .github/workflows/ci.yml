name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: python -m compileall -q .
      - name: Check public release
        run: python scripts/check_public.py
      - name: Run tests
        env:
          PANEL_USER: ci
          PANEL_PASS: ci-test-password
          JWT_SECRET: ci-test-secret-that-is-not-used-in-production
        run: pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tool
        run: python -m pip install "pip-audit>=2.9,<3"
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
